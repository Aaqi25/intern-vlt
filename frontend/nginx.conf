server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25M;

    # AI Resume Screener (:5020)
    location /api/screener/ {
        rewrite ^/api/screener/(.*)$ /api/$1 break;
        proxy_pass http://resume-api:5020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Python Coding Sandbox (:8000)
    location /api/v1/sandbox {
        proxy_pass http://sandbox-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Job Portal API (:5050)
    location /api/job-portal {
        proxy_pass http://job-portal-api:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Project Analysis / LogLense API (:5030)
    location ~ ^/api/(work-descriptions|logs|review) {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://project-analysis-api:5030;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Gateway-managed Intern & Coding summary APIs (:8080)
    location ~ ^/api/(interns|coding) {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Core InterviewX API (:5000) & Uploads
    location /api/ {
        proxy_pass http://interview-api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /uploads/ {
        proxy_pass http://interview-api:5000;
        proxy_set_header Host $host;
    }

    # Live Interview WebSocket
    location /ws/ {
        proxy_pass http://interview-api:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # React SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
